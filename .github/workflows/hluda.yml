name: Build strongR-frida (hluda) Server (android-x86_64)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      frida_version:
        description: 'Frida version to build'
        required: true
        default: '17.16.4'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget unzip bison flex

      - name: Clone Frida source
        run: |
          git clone --recurse-submodules -b ${{ github.event.inputs.frida_version || '17.16.4' }} https://github.com/frida/frida.git
          cd frida
          git submodule update --init --recursive

      - name: Apply strongR-frida patches
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          git clone https://github.com/hluwa/Patchs.git
          cd frida/subprojects/frida-core
          for p in $(ls ../../../Patchs/strongR-frida/frida-core/*.patch | sort); do
            echo "=== Applying: $(basename $p) ==="
            if ! git am --3way "$p"; then
              echo "⚠️ Patch failed: $(basename $p), skipping..."
              git am --skip
            fi
          done

      - name: Clean old NDK and Install NDK r29
        run: |
          unset ANDROID_NDK_ROOT
          unset ANDROID_NDK_HOME
          sudo rm -rf /usr/local/lib/android/sdk/ndk/*
          sudo rm -rf $ANDROID_HOME/ndk/* 2>/dev/null || true
          # 下载 NDK r29
          wget -q https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q android-ndk-r29-linux.zip
          echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r29" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/android-ndk-r29" >> $GITHUB_ENV
          cat $GITHUB_WORKSPACE/android-ndk-r29/source.properties

      - name: Build frida-server
        run: |
          cd frida/subprojects/frida-core
          export ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT
          echo "Using NDK: $ANDROID_NDK_ROOT"
          cat $ANDROID_NDK_ROOT/source.properties
          ./configure --host=android-x86_64
          make -j$(nproc)

          echo "=========================================="
          echo "=== 查找编译产物 ==="
          echo "=========================================="
          echo "--- 查找 frida-server ---"
          find . -name "frida-server" -type f
          echo "--- 查找所有可执行文件 ---"
          find build -type f -executable 2>/dev/null || true
          echo "--- 列出 build 目录结构 ---"
          find build -type f 2>/dev/null | head -50 || true
          echo "=========================================="

          SERVER_PATH=$(find . -name "frida-server" -type f | head -1)
          if [ -z "$SERVER_PATH" ]; then
            echo "❌ 编译产物 frida-server 未找到！"
            exit 1
          fi
          mkdir -p $GITHUB_WORKSPACE/output
          cp "$SERVER_PATH" $GITHUB_WORKSPACE/output/hluda-server
          chmod +x $GITHUB_WORKSPACE/output/hluda-server
          echo "✅ 产物已复制到 output/hluda-server"
          ls -la $GITHUB_WORKSPACE/output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hluda-server-android-x86_64
          path: output/hluda-server

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: hluda-server-android-x86_64

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: hluda-server
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

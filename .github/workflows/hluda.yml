name: Build Florida/strongR Frida Server (x86_64)

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      frida_version:
        description: 'Frida version to build'
        required: true
        default: '17.16.4'
      patch_repo:
        description: 'Patch repo (Florida or strongR)'
        required: true
        default: 'Florida'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget unzip bison flex

      - name: Clone Frida source
        run: |
          git clone --recurse-submodules -b ${{ github.event.inputs.frida_version || '17.16.4' }} https://github.com/frida/frida.git
          cd frida
          git submodule update --init --recursive

      - name: Apply patches
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          if [ "${{ github.event.inputs.patch_repo }}" = "Florida" ]; then
            git clone https://github.com/Ylarod/Florida.git
            cd frida/subprojects/frida-core
            for p in $(ls ../../../Florida/patches/frida-core/*.patch | sort); do
              echo "=== Applying: $(basename $p) ==="
              if ! git am --3way "$p"; then
                echo "⚠️ Patch failed: $(basename $p), skipping..."
                git am --skip
              fi
            done
          else
            git clone https://github.com/hluwa/Patchs.git
            cd frida/subprojects/frida-core
            for p in $(ls ../../../Patchs/strongR-frida/frida-core/*.patch | sort); do
              echo "=== Applying: $(basename $p) ==="
              if ! git am --3way "$p"; then
                echo "⚠️ Patch failed: $(basename $p), skipping..."
                git am --skip
              fi
            done
          fi

      - name: Install Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q android-ndk-r29-linux.zip
          echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r29" >> $GITHUB_ENV

      - name: Build frida-server
        run: |
          cd frida
          export ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT
          make core-android-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: florida-server-android-x86_64
          path: frida/build/frida-android-x86_64/bin/frida-server

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: florida-server-android-x86_64

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: frida-server
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
